<div class="navbar w-100" [ngClass]="color">
  <div class="w-10">
    @if (showMenu) {
      <app-button fabButton icon="bars" iconLibrary="font-awesome" (clickEvent)="dispatchOpenMenu()" class="me-2">
      </app-button>
    }
    <h4 class="navbar-title m-0">{{ title }}</h4>
  </div>
  <div class="w-90">
    <ng-content select="[navbar-content]"></ng-content>
  </div>
</div>
